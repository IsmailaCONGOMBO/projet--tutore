<div class="page">
  <header class="page-header">
    <div>
      <h1>Attribution de Note</h1>
      <p>Évaluez le travail déposé par l'étudiant après lecture attentive.</p>
    </div>
  </header>

  <div class="form-card">
    <div class="help-text">
       Veuillez saisir une note entre 0 et 20 et justifier votre évaluation par un commentaire détaillé.
    </div>

    @if (message()) {
      <div [class]="'alert-' + message()?.type">
        {{ message()?.text }}
      </div>
    }

    <form [formGroup]="noteForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Choisir le rapport <span class="req">*</span></label>
        <select formControlName="rapport_id">
          <option value="">Sélectionnez un rapport...</option>
          @for (r of rapports(); track r.id) {
            <option [value]="r.id">{{ r.titre }} ({{ r.etudiant?.user?.name }})</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label>Note sur 20 <span class="req">*</span></label>
        <input 
          type="number" 
          formControlName="note"
          min="0" 
          max="20" 
          step="0.5" 
          placeholder="15.5"
        >
      </div>

      <div class="form-group">
        <label>Commentaire & Justification <span class="req">*</span></label>
        <textarea 
          formControlName="commentaire"
          rows="6" 
          placeholder="Détaillez les points forts et les points à améliorer..."
        ></textarea>
        <span class="optional">Ce commentaire sera visible par l'étudiant et l'administration.</span>
      </div>

      <div class="form-footer">
        <button 
          type="submit"
          class="btn-submit" 
          [disabled]="submitting() || noteForm.invalid"
        >
          {{ submitting() ? 'Envoi...' : 'Enregistrer la note' }}
        </button>
      </div>
    </form>
  </div>
</div>
