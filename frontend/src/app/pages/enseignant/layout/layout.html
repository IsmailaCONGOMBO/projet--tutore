<div class="app-shell" [class.sidebar-collapsed]="!sidebarOpen()">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🎓</span>
      <span class="brand-text">P-DETECT</span>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">{{ (user.name || 'E').charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <span class="user-name">{{ user.name || 'Enseignant' }}</span>
        <span class="user-role">Enseignant Correcteur</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">MENU</span>
      @for (item of menu; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button class="sidebar-logout" (click)="logout()">
      <span>⎋</span>
      <span>Déconnexion</span>
    </button>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="toggle-btn" (click)="toggleSidebar()">☰</button>
      <div class="topbar-center">
        <span class="topbar-title">Plateforme Enseignant</span>
      </div>
      <div class="topbar-right">
        <span class="topbar-user">{{ user.name }}</span>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </div>

</div>
