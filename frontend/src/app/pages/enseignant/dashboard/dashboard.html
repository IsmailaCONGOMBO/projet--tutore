<div class="page">
  <header class="page-header">
    <div>
      <h1>Bienvenue, {{ user.name }}</h1>
      <p>Voici un aperçu de vos corrections et évaluations en cours.</p>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon" style="background: #eff6ff; color: #2563eb;">📂</div>
      <div class="stat-info">
        <span class="stat-label">Assignés</span>
        <span class="stat-value">{{ nbAssignes() }}</span>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon" style="background: #fdf4ff; color: #d946ef;">✅</div>
      <div class="stat-info">
        <span class="stat-label">Corrigés</span>
        <span class="stat-value">{{ nbCorriges() }}</span>
      </div>
    </div>
    
    <div class="stat-card">
      <div class="stat-icon" style="background: #ecfdf5; color: #10b981;">🎯</div>
      <div class="stat-info">
        <span class="stat-label">Notes Soumises</span>
        <span class="stat-value">{{ nbNotes() }}</span>
      </div>
    </div>
  </div>

  <div class="table-card" style="margin-top: 2.5rem;">
    <div style="padding: 1.5rem; border-bottom: 1px solid var(--off-white-2);">
      <h3 style="font-size: 1rem; font-weight: 700; color: var(--blue-900);">Dernières assignations</h3>
    </div>
    <div class="empty-state" style="padding: 4rem;">
      <span>📝</span>
      Consultez l'onglet "Rapports assignés" pour commencer les corrections.
    </div>
  </div>
</div>
