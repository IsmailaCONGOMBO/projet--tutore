<div class="page">
  <div class="page-header">
    <h1>Soumettre un thème</h1>
    <p>Proposez votre sujet de stage pour validation par votre encadreur.</p>
  </div>

  <div class="form-card">
    @if (success()) { <div class="alert-success">✓ {{ success() }}</div> }
    @if (error())   { <div class="alert-error">⚠️ {{ error() }}</div> }

    <form (ngSubmit)="submit()">
      <div class="form-group">
        <label>Titre du thème <span class="req">*</span></label>
        <input type="text" [(ngModel)]="titre" name="titre"
          placeholder="Ex : Développement d'une application de gestion scolaire" />
      </div>

      <div class="form-group">
        <label>Description <span class="req">*</span></label>
        <textarea [(ngModel)]="description" name="description" rows="6"
          placeholder="Décrivez votre thème de stage en détail : objectifs, méthodologie, résultats attendus…"></textarea>
      </div>

      <div class="form-footer">
        <button type="submit" class="btn-submit" [disabled]="loading()">
          {{ loading() ? 'Envoi en cours…' : '💡 Soumettre le thème' }}
        </button>
      </div>
    </form>
  </div>
</div>
